<head>

    This is a placeholder for base href that will be replaced by the value of

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ACADENO Lead Manager CRM">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="acadeno_crm">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Guard against known @firebase/firestore 13.1.0 watch-stream race assertion (ID: ca9 / b815)
    // and WebGL2 context loss / Skia shader compilation spam on browser GPU reset
    (function () {
      var suppressShaderBlockLines = 0;

      function isIgnorableNoise(args) {
        if (suppressShaderBlockLines > 0) {
          suppressShaderBlockLines--;
          return true;
        }
        for (var i = 0; i < args.length; i++) {
          var s = String(args[i] || '');
          if (s.indexOf('Shader compilation error') !== -1 ||
              s.indexOf('Program linking error') !== -1) {
            suppressShaderBlockLines = 60;
            return true;
          }
          if (s.indexOf('INTERNAL ASSERTION FAILED') !== -1 ||
              s.indexOf('ID: b815') !== -1 ||
              s.indexOf('ID: ca9') !== -1 ||
              s.indexOf('uTextureSampler_0_S0') !== -1 ||
              s.indexOf('sk_FragColor') !== -1 ||
              s.indexOf('sk_FragCoord') !== -1 ||
              s.indexOf('vQuadEdge_S0') !== -1 ||
              s.indexOf('vTextureCoords_S0') !== -1 ||
              s.indexOf('urectUniform_S1_c0') !== -1 ||
              s.indexOf('outputCoverage_S0') !== -1 ||
              s.indexOf('#version 300 es') !== -1 ||
              s.indexOf('precision mediump') !== -1 ||
              s.indexOf('(unknown error)') !== -1 ||
              s.indexOf('------------------------') !== -1 ||
              /^\s*\d+\t/.test(s)) {
            return true;
          }
        }
        return false;
      }

      var origError = console.error;
      console.error = function () {
        if (isIgnorableNoise(arguments)) return;
        return origError.apply(console, arguments);
      };

      var origWarn = console.warn;
      console.warn = function () {
        if (isIgnorableNoise(arguments)) return;
        return origWarn.apply(console, arguments);
      };

      var origLog = console.log;
      console.log = function () {
        if (isIgnorableNoise(arguments)) return;
        return origLog.apply(console, arguments);
      };

      var origInfo = console.info;
      console.info = function () {
        if (isIgnorableNoise(arguments)) return;
        return origInfo.apply(console, arguments);
      };

      var origDebug = console.debug;
      console.debug = function () {
        if (isIgnorableNoise(arguments)) return;
        return origDebug.apply(console, arguments);
      };

      // Force WebGL1 context for CanvasKit to avoid WebGL2 (#version 300 es) ANGLE shader compilation errors on Windows GPUs
      if (typeof HTMLCanvasElement !== 'undefined' && HTMLCanvasElement.prototype.getContext) {
        var origGetContext = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function (type, attrs) {
          if (type === 'webgl2') {
            return null;
          }
          if (type === 'webgl' || type === 'experimental-webgl') {
            var safeAttrs = Object.assign({ powerPreference: 'default', failIfMajorPerformanceCaveat: false }, attrs || {});
            return origGetContext.call(this, type, safeAttrs);
          }
          return origGetContext.apply(this, arguments);
        };
      }

      window.addEventListener('unhandledrejection', function (event) {
        var msg = String((event && event.reason) || '');
        if (msg.indexOf('INTERNAL ASSERTION FAILED') !== -1 ||
            msg.indexOf('ID: b815') !== -1 ||
            msg.indexOf('ID: ca9') !== -1) {
          event.preventDefault();
        }
      });

      // Automatically recover if Chrome drops the WebGL GPU context
      window.addEventListener('webglcontextlost', function (e) {
        e.preventDefault();
      }, true);
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/firebase-messaging-sw.js')
          .then(function (registration) {
            console.log('Firebase Messaging ServiceWorker registered with scope:', registration.scope);
          }).catch(function (err) {
            console.log('ServiceWorker registration notice:', err);
          });
      });
    }

    // Helper exposed to Flutter for background sync messaging
    window.startBackgroundSync = function (uid) {
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({
          type: 'START_BACKGROUND_SYNC',
          uid: uid
        });
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
