name: acadeno_crm
description: "ACADENO Lead Manager CRM - A cross-platform customer relationship management application built with Flutter for managing leads, user assignments, follow-ups, and reports, with Firebase integration."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  auto_route: ^11.2.0
  cloud_firestore: ^7.1.0
  cupertino_icons: ^1.0.8
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.0.17
  freezed_annotation: ^3.1.0
  gap: ^3.0.1
  get_it: ^8.0.3
  google_fonts: ^6.3.3
  injectable: ^3.0.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^22.3.3
  http: ^1.6.0
  connectivity_plus: ^7.3.2
  file_picker: ^13.3.0
  url_launcher: ^6.3.3
  web: ^1.1.1

dev_dependencies:
  auto_route_generator: ^10.6.0
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svgs/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
        - asset: assets/fonts/poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
          weight: 800
